[project]
name = "sentry"

[specs]
path = ".sentry/specs"

[pytest]
command = "pytest"

[tests]
paths = ["tests", "frontend/e2e"]

[e2e]
# Sem --reporter na linha de comando: a flag sobrepoe o reporter do
# playwright.config.ts inteiro e escreve o JUnit no stdout, ignorando o
# `outputFile` declarado la. Quem decide onde gravar e' a config do projeto.
command = "npx playwright test"
junit_xml = "frontend/reports/junit.xml"
cwd = "frontend"
paths = ["frontend/e2e"]

[analysis]
run_tests_by_default = false
timeout_seconds = 300
# frontend/ segue fora do escopo de cobertura de linha: nenhum coverage.py, lcov
# ou Cobertura mede TSX, e tirar daqui faria todo diff de frontend acusar
# `coverage-missing` falso -- a mesma armadilha do G11, um nivel acima. A camada
# frontend entra pela suite [e2e] e pela dimensao de interface, nunca por linha.
exclude = ["frontend/"]

[policy.thresholds]
changed_coverage = 90
global_coverage = 95
