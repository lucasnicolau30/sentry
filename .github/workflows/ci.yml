name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    # Windows e Linux juntos de proposito: o Sentry manipula caminho o tempo
    # todo (diff do Git, cobertura, rastreabilidade), e separador e' a classe
    # de bug que so aparece no outro sistema.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          # O Sentry le o diff do Git: com o clone raso padrao (depth 1) nao ha
          # historico para comparar, e a analise sai sem arquivos alterados.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest coverage

      - name: Suíte
        run: python -m pytest -q

  autoanalise:
    # O Sentry se analisa. Roda depois da suite, so no Linux: o objetivo aqui
    # nao e' portabilidade, e' o veredito sobre a propria mudanca.
    needs: testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determinar a base de comparação e se há código Python no diff
        # Sem --base, o LocalGitAdapter compara contra HEAD -- e um checkout
        # limpo ja esta em HEAD, entao o diff sai sempre vazio (0 arquivos),
        # nao importa o que o commit tenha mudado. base e' o commit anterior
        # ao push (ou a base declarada da PR), para haver diff de verdade.
        #
        # has_python decide se ha' algo que a suite pytest/coverage consiga
        # medir: um push que so muda markdown ou frontend nao tem cobertura
        # de linha pra checar, e cairia sempre em Inconclusivo -- nao por
        # estar errado, so por nao ter o que este job mede.
        id: diff
        run: |
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          if git diff --name-only "$BASE" HEAD -- '*.py' | grep -q .; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.diff.outputs.has_python == 'true'
        with:
          python-version: "3.12"

      - name: Instalar
        if: steps.diff.outputs.has_python == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest coverage

      - uses: actions/setup-node@v4
        if: steps.diff.outputs.has_python == 'true'
        with:
          node-version: "20"

      - name: Instalar a suite e2e do frontend
        if: steps.diff.outputs.has_python == 'true'
        # [e2e] em sentry.toml sobe uma segunda suite (Playwright) durante a
        # auto-analise: sem o Node e os browsers instalados, o job falharia por
        # ambiente -- exatamente a distincao que os codigos de saida existem
        # para preservar, entao instalamos antes de medir.
        run: |
          npm ci --prefix frontend
          npx --prefix frontend playwright install --with-deps chromium

      - name: Analisar a própria mudança
        if: steps.diff.outputs.has_python == 'true'
        # Codigo de saida: 0 aprovado, 1 com ressalvas, 2 reprovado,
        # 3 inconclusivo/infraestrutura. Aprovado e ressalva passam; acima disso
        # derruba o build.
        #
        # O 3 entrou aqui depois de deixar este job verde sem medir nada: as specs
        # nao eram versionadas, o checkout limpo nao encontrava matriz de casos, o
        # `run` saia com 3 e a expressao antiga (`== 2 ? 1 : 0`) traduzia isso em
        # sucesso -- e o passo seguinte publicava um latest.md de commits atras.
        # Para o job que existe para provar que o produto funciona, "nao consegui
        # medir" e' falha, nao aprovacao silenciosa.
        run: |
          sentry run --spec all --run-tests --base "${{ steps.diff.outputs.base }}" || codigo=$?
          echo "veredito (exit ${codigo:-0})"
          exit $(( ${codigo:-0} > 1 ? 1 : 0 ))

      - name: Publicar o relatório
        if: always() && steps.diff.outputs.has_python == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sentry-report
          path: .sentry/reports/latest.md

  pacote:
    # Constroi e instala num ambiente limpo: garante que o wheel sai valido e
    # que o comando `sentry` existe depois de instalado.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Construir
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Instalar o wheel e conferir o comando
        run: |
          python -m pip install dist/*.whl
          sentry --version
